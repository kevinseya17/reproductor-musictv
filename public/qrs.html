<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Códigos QR para Mesas | Reproductor MusicTV</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @media print {
      body {
        background: white !important;
        color: black !important;
      }
      .no-print {
        display: none !important;
      }
      .qr-card {
        page-break-inside: avoid;
        border: 2px solid #000 !important;
        box-shadow: none !important;
      }
    }
  </style>
</head>
<body class="bg-gray-950 text-white min-h-screen p-4 sm:p-8">

  <div class="max-w-6xl mx-auto space-y-6">

    <!-- Header no imprimible -->
    <div class="no-print flex flex-col sm:flex-row gap-4 items-start sm:items-center justify-between bg-gray-900 p-4 sm:p-6 rounded-2xl border border-white/10">
      <div>
        <h1 class="text-lg sm:text-xl font-bold text-amber-400">Generador de Códigos QR para Mesas</h1>
        <p class="text-xs text-gray-400 mt-1">Imprime estos códigos para colocarlos en los soportes acrílicos o pegatinas de cada mesa.</p>
      </div>
      <button onclick="window.print()" class="w-full sm:w-auto justify-center bg-amber-500 hover:bg-amber-400 text-black font-bold px-6 py-3 rounded-xl text-sm flex items-center gap-2 shadow-lg cursor-pointer">
        <span>🖨️</span> Imprimir Tarjetas de Mesas
      </button>
    </div>

    <!-- Rejilla de Tarjetas QR -->
    <div id="qrGrid" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-6">
      <div class="col-span-full text-center py-12">
        <div class="inline-block w-8 h-8 border-3 border-amber-400 border-t-transparent rounded-full animate-spin"></div>
        <p class="text-xs text-gray-400 mt-3">Generando códigos QR para las mesas...</p>
      </div>
    </div>

  </div>

  <script>
    async function loadQRs() {
      try {
        const [qrsRes, statusRes] = await Promise.all([
          fetch('/api/qrs'),
          fetch('/api/status')
        ]);
        const { qrs } = await qrsRes.json();
        const { settings } = await statusRes.json();
        const barName = settings?.barName || 'Music Bar';

        const grid = document.getElementById('qrGrid');
        grid.innerHTML = qrs.map(item => `
          <div class="qr-card bg-white text-black p-6 rounded-2xl border border-gray-200 shadow-xl flex flex-col items-center text-center space-y-3">
            <div class="space-y-0.5">
              <span class="text-xl">🎷</span>
              <h2 class="text-base font-extrabold tracking-tight uppercase">${barName}</h2>
              <p class="text-[10px] text-gray-500 font-semibold tracking-wider uppercase">Pide tu música desde aquí</p>
            </div>

            <div class="p-2 border-2 border-dashed border-gray-300 rounded-xl">
              <img src="${item.qrDataUrl}" alt="QR Mesa ${item.tableNumber}" class="w-48 h-48 object-contain">
            </div>

            <div class="bg-black text-amber-400 px-5 py-1.5 rounded-full text-sm font-black tracking-wider uppercase">
              ${item.tableNumber === 'Barra' ? 'BARRA' : 'MESA ' + item.tableNumber}
            </div>

            <div class="text-[10px] text-gray-600 space-y-0.5 pt-1 border-t border-gray-200 w-full">
              <p class="font-bold">1. Abre la cámara de tu celular</p>
              <p>2. Elige tu canción en YouTube</p>
              <p>3. ¡El DJ Inteligente la pone a sonar!</p>
            </div>
          </div>
        `).join('');
      } catch (err) {
        console.error('Error cargando QRs:', err);
      }
    }

    document.addEventListener('DOMContentLoaded', loadQRs);
  </script>
</body>
</html>
